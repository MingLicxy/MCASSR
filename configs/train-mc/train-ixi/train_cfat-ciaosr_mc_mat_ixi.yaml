train_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: /home/caoxinyu/Arbitrary-scale/data/IXI/2D_mat/train/T2 # PD辅助T2
      root_path_2: /home/caoxinyu/Arbitrary-scale/data/IXI/2D_mat/train/PD
      repeat: 10 # 20
      cache: mat # ['none'(不缓存), 'bin'(二进制), 'in_memory'(RGB), in_memory_L'(针对单通道灰度图), 'mat'(.mat存储numpy数组)]
  wrapper:
    name: mc-sr-implicit-downsampled-dual
    args:
      inp_size: 48    #64
      scale_min: 1
      scale_max: 4
      augment: true
      sample_q: 2304       #4096
  batch_size: 16

val_dataset:
  dataset:
    name: paired-image-folders
    args:
      root_path_1: /home/caoxinyu/Arbitrary-scale/data/IXI/2D_mat/valid/T2
      root_path_2: /home/caoxinyu/Arbitrary-scale/data/IXI/2D_mat/valid/PD
      first_k: 10
      repeat: 160
      cache: mat
  wrapper:
    name: mc-sr-implicit-downsampled-dual
    args:
      inp_size: 48 # 64
      scale_min: 1
      scale_max: 4
      sample_q: 2304 # 4096
  batch_size: 16 #8

# 决定如何在训练阶段计算指标
eval_type: kspace
eval_bsize: ~    # eval_bsize与val_dataset中的batch_size不同

data_norm:
  inp: {sub: [0.5], div: [0.5]}
  ref: {sub: [0.5], div: [0.5]} # 区别于普通ASSR
  gt: {sub: [0.5], div: [0.5]}

model:
  name: ciaosr_mc
  args:
    encoder:
      name: cfat_mc # 混合特征主干有待设计
      args:
        no_upsampling: true
    ref_encoder: # 可以选用现成主干或者自行搭建
      name: rcan_mat 
      args:
        no_upsampling: true
    imnet_q:  # QKV投影层的输入维度在CiaoSR_MC中指定
      name: mlp
      args:
        out_dim: 256         # 25会在CiaoSR中被更新掉
        hidden_list: [ 256 ]
    imnet_k:
      name: mlp
      args:
        out_dim: 256
        hidden_list: [ 256 ]
    imnet_v:
      name: mlp
      args:
        out_dim: 256
        hidden_list: [ 256 ]
    imnet_c:
      name: mlp
      args:
        out_dim: 2 # for .mat
        hidden_list: [ 256 ]

    local_size: 2 
    feat_unfold: true
    non_local_attn: true
    multi_scale: [2]
    softmax_scale: 1

optimizer:
  name: adam
  args:
    lr: 1.e-4
    
epoch_max: 1000         #1200
multi_step_lr:
  milestones: [200, 400, 600, 800]    #[200, 400, 600, 800, 1000]
  gamma: 0.5

epoch_val: 1   
epoch_save: 100     #50

resume: ~  
pre_train: ~