train_dataset:
  dataset:
    name: image-folder
    args:
      root_path: /home/caoxinyu/Arbitrary-scale/data/train_data/IR700_clean
      repeat: 20 # 20 for bz 16, 40 for bz 32
      cache: in_memory
  wrapper:
    name: sr-implicit-downsampled-cascaded
    args:
      inp_size: 48
      batch_size: 16
      scale_min: [1]
      scale_max: [4]
      sample_q: 2304
      augment: True
      phase: train
      k: 1

  batch_size: 16

val_dataset:
  dataset:
    name: image-folder
    args:
      root_path: /home/caoxinyu/Arbitrary-scale/data/train_data/IR700_clean
      first_k: 10
      repeat: 160
      cache: in_memory
  wrapper:
    name: sr-implicit-downsampled-cascaded
    args:
      inp_size: 48
      batch_size: 16 # 32
      scale_min: [4]
      scale_max: [4]
      sample_q: 2304
      phase: valid

  batch_size: 16 # 32

data_norm:
  inp: {sub: [0.5], div: [0.5]}
  gt: {sub: [0.5], div: [0.5]}

model:
  name: clit
  args:
    base_dim: 256
    head: 8
    r: 3
    imnet_num: 1 # 与级联相关
    conv_num: 1
    is_cell: True
    local_attn: True

    encoder_spec:
      name: edsr-baseline
      args:
        no_upsampling: True
  
    pb_spec:
      name: posenc
      args:
        posenc_type: 'sinusoid'
        posenc_scale: 10
        hidden_dims: 64
        enc_dims: 64
        gamma: 1
  
    imnet_spec:
      name: mlp
      args:
        out_dim: 3
        hidden_list: [256,256,256,256]
        act: 'gelu'

optimizer:
  name: adam
  args:
    lr: 1.e-4
    
epoch_max: 1000
multi_step_lr:
  milestones: [200, 400, 600, 800]
  gamma: 0.5

epoch_val: 1
epoch_save: 100

resume: ~
pre_train: ~
