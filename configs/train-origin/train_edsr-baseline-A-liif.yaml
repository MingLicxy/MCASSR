train_dataset:
  dataset:
    name: image-folder
    args:
      root_path: /home/caoxinyu/Arbitrary-scale/data/train_data/IR700_clean
      repeat: 20
  wrapper:
    name: sr-implicit-downsampled
    args:
      inp_size: 48
      scale_min: 1
      scale_max: 4
      augment: true
      sample_q: 2304
  batch_size: 16      #8

val_dataset:
  dataset:
    name: image-folder
    args:
      root_path: /home/caoxinyu/Arbitrary-scale/data/train_data/IR700_clean
      first_k: 10
      repeat: 160
  wrapper:
    name: sr-implicit-downsampled
    args:
      inp_size: 48
      scale_max: 4
      sample_q: 2304
  batch_size: 16

data_norm:
  inp: {sub: [0.5], div: [0.5]}
  gt: {sub: [0.5], div: [0.5]}

model:
  name: liif_a
  args:
    encoder_spec: # 编码器
      name: edsr-baseline
      args:
        no_upsampling: true
    imnet_spec: # 解码器
      name: mlp_pw
      args:
        out_dim: 3
        hidden_list: [16, 16, 16, 16]
    pdn_spec: # 扩展网络
      name: ExpansionNet
      args:
        in_dim: 580
        out_dim: 10
        hidden_list: [ 256, 256, 256, 256 ]
    basis_spec: # 管理MLP权重偏置
      name: basis
      args:
        basis_num: 10
        hidden: 16
        state: train
        path: ~        # 只在test时有效
## pdn_spec[out_dim]==basis_spec[basis_num]
optimizer:
  name: adam
  args:
    lr: 1.e-4
epoch_max: 1000
multi_step_lr:
  milestones: [200, 400, 600, 800]
  gamma: 0.5

epoch_val: 1
epoch_save: 100

resume: ~
pre_train: ~