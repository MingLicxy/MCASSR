train_dataset:
  dataset:
    name: image-folder
    args:
      root_path: /home/caoxinyu/Arbitrary-scale/data/train_data/IR700/GT
      repeat: 20
      cache: in_memory
      # first_k: 10
  wrapper:
    name: sr-implicit-downsampled
    args:
      inp_size: 48
      scale_min: 1 # 最小放大倍数
      scale_max: 4 # 最大放大倍数
      augment: true
      sample_q: 2304
  batch_size: 16

val_dataset:
  dataset:
    name: image-folder
    args:
      root_path: /home/caoxinyu/Arbitrary-scale/data/train_data/IR700/GT
      first_k: 10 # 仅使用前k张验证图像
      repeat: 160
      cache: in_memory
  wrapper:
    name: sr-implicit-downsampled
    args: 
        inp_size: 48
        scale_max: 4
        sample_q: 2304
  batch_size: 16

# eval_scale: [2]
# eval_bsize: 30000


data_norm:
  inp: {sub: [0.5], div: [0.5]}
  gt: {sub: [0.5], div: [0.5]}

model:
  name: lmi
  args:
    encoder_spec:
      name: rdn
      args:
        no_upsampling: true
    imnet_spec:
      name: MLP-mixer-all-no_norm-sr64-localE
      args:
        depth: 1
        out_dim: 3
        hidden_list: [256]

optimizer:
  name: adam
  args:
    lr: 1.e-4


epoch_max: 1000
multi_step_lr:
  milestones: [200, 400, 600, 800]
  gamma: 0.5

epoch_val: 1
epoch_save: 100

resume: ~
pre_train: ~