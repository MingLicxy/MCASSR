train_dataset:
  dataset:
    name: image-folder
    args:
      root_path: /home/caoxinyu/Arbitrary-scale/data/train_data/IR700_clean
      repeat: 20 # 20 for bz 16
      cache: in_memory    #bin
  wrapper:
    name: sr-implicit-downsampled
    args:
      inp_size: 48
      scale_max: 4
      scale_min: 1
      augment: true
      sample_q: 2304
  batch_size: 16

val_dataset:
  dataset:
    name: image-folder
    args:
      root_path: /home/caoxinyu/Arbitrary-scale/data/train_data/IR700_clean 
      first_k: 10
      repeat: 160
      cache: in_memory     #bin
  wrapper:
    name: sr-implicit-downsampled
    args:
      inp_size: 48
      scale_max: 4
      #scale_min: 1
      sample_q: 2304
  batch_size: 16

data_norm:
  inp: {sub: [0.5], div: [0.5]}
  gt: {sub: [0.5], div: [0.5]}

model:
  name: itnsr
  args:
    feat_unfold: True # 特征展开3x3
    local_ensemble: True # 局部集成
    scale_token: True # 像素尺度额外输入
    encoder_spec:
      name: edsr-baseline
      args:
        no_upsampling: true

    imnet_spec:
      name: mlp
      args:
        # in_dim: 1728
        # out_dim: 3
        hidden_list: [256,256,256,256]
        act: 'gelu'  # 指定MLP中所用的激活函数（默认值为relu）

    embedding_coord: ~
    embedding_scale: ~

optimizer:
  name: adam
  args:
    lr: 1.e-4           #2.e-4


epoch_max: 1000
multi_step_lr:
  milestones: [200, 400, 600, 800] #[100, 200, 400, 600, 800]
  gamma: 0.5

epoch_val: 1
epoch_save: 100

resume: ~
pre_train: ~